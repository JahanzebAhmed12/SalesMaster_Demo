# =============================================================================
# backup.conf — Configuration for sqlite_backup.sh
# Edit these values to match your environment.
# =============================================================================

# -----------------------------------------------------------------------------
# REQUIRED: Path to your SQLite database file
# -----------------------------------------------------------------------------
DB_PATH="/root/SalesMasterDashboard/backend/instance/salesmaster.db"

# -----------------------------------------------------------------------------
# Where to store backups (absolute path, must be writable)
# Backups are organised as: $BACKUP_ROOT/YYYY/MM/dbname_YYYY-MM-DD_HH-MM-SS.db.gz
# -----------------------------------------------------------------------------
BACKUP_ROOT="/root/backups/salesmaster"

# -----------------------------------------------------------------------------
# Log directory
# -----------------------------------------------------------------------------
LOG_DIR="/root/log/salesmaster-backup"

# -----------------------------------------------------------------------------
# Retention settings
#
#   HOURLY_RETENTION_DAYS — keep ALL hourly snapshots for this many days.
#                           Each is a full DB snapshot, so keep this small.
#                           (7 days = 7 × 24 = 168 hourly files)
#
#   DAILY_RETENTION_DAYS  — beyond HOURLY_RETENTION_DAYS, keep only the LAST
#                           backup of each calendar day for this many days.
#
#   MAX_RETENTION_DAYS    — between (HOURLY+DAILY) and MAX: keep only the LAST
#                           backup of each calendar MONTH. Everything older
#                           than MAX is deleted permanently.
# -----------------------------------------------------------------------------
HOURLY_RETENTION_DAYS=7
DAILY_RETENTION_DAYS=90
MAX_RETENTION_DAYS=365

# -----------------------------------------------------------------------------
# gzip compression level (1=fastest/largest … 9=slowest/smallest, default 6)
# -----------------------------------------------------------------------------
GZIP_LEVEL=6

# -----------------------------------------------------------------------------
# Minimum free disk space (MB) before a warning alert is sent
# -----------------------------------------------------------------------------
MIN_FREE_MB=500

# -----------------------------------------------------------------------------
# Alert e-mail address (leave empty to disable e-mail alerts)
# Requires sendmail / postfix / msmtp to be configured on the host.
# -----------------------------------------------------------------------------
ALERT_EMAIL=""
# ALERT_EMAIL="ops@example.com"
